plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace "il2cpp.typefaces"

    defaultConfig {
        applicationId "il2cpp.typefaces"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            storeFile file("HunMod.keystore") // Укажите путь к вашему keystore
            storePassword "HunMod" // Замените на пароль хранилища
            keyAlias "HunMod" // Замените на ваш alias
            keyPassword "HunMod" // Замените на пароль ключа
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file("src/main/jni/Android.mk")
        }
    }
    
 //   ndkVersion "24.0.8215888"
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
}